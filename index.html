<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e52521" />
  <title>Kart Tournament</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%81%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="app-header">
    <h1>🏁 Kart Tournament</h1>
    <button id="resetBtn" class="btn btn-ghost btn-sm" hidden>Reset</button>
  </header>

  <main id="app">
    <!-- ============ SETUP ============ -->
    <section id="screen-setup" class="screen">
      <div class="card">
        <h2>Set up the tournament</h2>
        <p class="muted">Set how many racers (8–20), name each one, pick a character, then start.</p>

        <div class="count-control">
          <span class="count-label">How many racers?</span>
          <div class="stepper">
            <button type="button" id="countMinus" class="step-btn" aria-label="Fewer racers">−</button>
            <input type="number" id="cfgCount" min="8" max="20" value="8" inputmode="numeric" aria-label="Number of racers" />
            <button type="button" id="countPlus" class="step-btn" aria-label="More racers">＋</button>
          </div>
        </div>

        <div class="config-row">
          <label>Qualifying rounds
            <input type="number" id="cfgRounds" min="1" max="12" value="4" inputmode="numeric" />
          </label>
          <label>Points (1st→last)
            <input type="text" id="cfgPoints" value="4, 3, 2, 1" />
          </label>
        </div>

        <div id="charStatus" class="char-status"></div>

        <div id="participantList" class="participant-list"></div>

        <div class="setup-actions">
          <button id="addParticipantBtn" class="btn btn-secondary">+ Add racer</button>
          <span id="countHint" class="muted count-hint"></span>
        </div>

        <button id="startBtn" class="btn btn-primary btn-block" disabled>Start tournament</button>
      </div>
    </section>

    <!-- ============ QUALIFYING ============ -->
    <section id="screen-qualifying" class="screen" hidden>
      <div class="round-head">
        <div>
          <h2 id="roundTitle">Round 1</h2>
          <p class="muted" id="roundSub"></p>
        </div>
        <button id="showBoardBtn" class="btn btn-ghost btn-sm">Leaderboard</button>
      </div>
      <div id="racesContainer"></div>
      <button id="nextRoundBtn" class="btn btn-primary btn-block" disabled>Next</button>
    </section>

    <!-- ============ FINAL ============ -->
    <section id="screen-final" class="screen" hidden>
      <div class="card final-card">
        <h2>🏆 Final Four</h2>
        <p class="muted">Top 4 by points race for the podium. This race decides 1st, 2nd &amp; 3rd.</p>
        <div id="finalRace"></div>
        <button id="finishFinalBtn" class="btn btn-primary btn-block" disabled>Crown the champions</button>
      </div>
    </section>

    <!-- ============ CELEBRATION ============ -->
    <section id="screen-celebration" class="screen" hidden>
      <div id="celebration"></div>
      <button id="newTournamentBtn" class="btn btn-primary btn-block">Start a new tournament</button>
    </section>
  </main>

  <!-- Leaderboard modal -->
  <div id="boardModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3>Leaderboard</h3>
        <button class="btn btn-ghost btn-sm" data-close-board>✕</button>
      </div>
      <ol id="boardList" class="board-list"></ol>
    </div>
  </div>

  <!-- Character picker modal -->
  <div id="charModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3>Pick a character</h3>
        <button class="btn btn-ghost btn-sm" data-close-char>✕</button>
      </div>
      <input type="text" id="charSearch" class="char-search" placeholder="Search characters…" />
      <div id="charGrid" class="char-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
